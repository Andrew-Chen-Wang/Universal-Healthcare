# Deploys each pull request to https://<pages domain>/pr-preview/pr-<number>/ on the
# gh-pages branch, and removes it when the pull request closes. Comment `ci preview`
# on an open pull request to rebuild it (e.g. after reopening, or if it went missing).
# Scripts are adapted from rossjrw/pr-preview-action; see .github/scripts/pr-preview.
name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: 1
  UMBRELLA_DIR: pr-preview
  PREVIEW_BRANCH: gh-pages

jobs:
  setup:
    name: Decide what to do
    # Same-repo pull requests only: fork pull requests get a read-only token. On
    # comments, only people with write access can ask for a preview.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, 'preview') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      deployment_action: ${{ steps.setup.outputs.deployment_action }}
      pr_number: ${{ steps.setup.outputs.pr_number }}
      head_sha: ${{ steps.setup.outputs.head_sha }}
      base_path: ${{ steps.setup.outputs.base_path }}
      preview_file_path: ${{ steps.setup.outputs.preview_file_path }}
      preview_url: ${{ steps.setup.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: setup
        env:
          GH_TOKEN: ${{ github.token }}
          CNAME_FILE: apps/website/public/CNAME
        run: bash .github/scripts/pr-preview/setup.sh
      - name: Acknowledge the `ci preview` comment
        if: github.event_name == 'issue_comment' && steps.setup.outputs.reason != 'comment is not a preview command'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          CONTENT: ${{ steps.setup.outputs.deployment_action == 'deploy' && '+1' || 'confused' }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions"
          -f content="$CONTENT" > /dev/null

  build:
    name: Build preview
    needs: setup
    if: needs.setup.outputs.deployment_action == 'deploy'
    runs-on: ubuntu-latest
    # Runs the pull request's code, so it gets no write access.
    permissions:
      contents: read
    concurrency:
      group: pr-preview-build-${{ needs.setup.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          # Comment-triggered runs share the default branch's cache scope; don't let
          # pull request code write to it.
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # The path review page writes to a local file, so it only exists in development.
      - run: rm -rf apps/website/src/app/paths/review
      - name: Build static site
        run: pnpm --filter website exec next build
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: ${{ needs.setup.outputs.base_path }}
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ needs.setup.outputs.pr_number }}
          path: apps/website/out
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy preview
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      pages: read
    concurrency:
      group: pr-preview-publish-${{ needs.setup.outputs.pr_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
      PREVIEW_URL: ${{ needs.setup.outputs.preview_url }}
      HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ needs.setup.outputs.pr_number }}
          path: ${{ runner.temp }}/preview
      - id: publish
        env:
          COMMIT_MESSAGE: "Deploy preview for PR ${{ needs.setup.outputs.pr_number }} 🛫"
        run: >-
          bash .github/scripts/pr-preview/publish.sh deploy
          "${{ needs.setup.outputs.preview_file_path }}" "$RUNNER_TEMP/preview"
      - id: wait
        name: Wait for GitHub Pages
        if: steps.publish.outputs.deployment_status == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: >-
          bash .github/scripts/pr-preview/wait-for-pages-deployment.sh
          "$GITHUB_REPOSITORY" "${{ steps.publish.outputs.deployed_commit_sha }}" "$PREVIEW_BRANCH" "$GH_TOKEN"
      - name: Comment with the preview link
        env:
          PAGES_READY: ${{ steps.wait.outcome == 'success' || steps.publish.outputs.deployment_status == 'skipped' }}
        run: |
          bash .github/scripts/pr-preview/generate-comment.sh deploy > "$RUNNER_TEMP/comment.md"
          bash .github/scripts/pr-preview/comment.sh "$PR_NUMBER" "$RUNNER_TEMP/comment.md"

  remove:
    name: Remove preview
    needs: setup
    if: needs.setup.outputs.deployment_action == 'remove'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: pr-preview-publish-${{ needs.setup.outputs.pr_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
      PREVIEW_URL: ${{ needs.setup.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          COMMIT_MESSAGE: "Remove preview for PR ${{ needs.setup.outputs.pr_number }} 🛬"
        run: bash .github/scripts/pr-preview/publish.sh remove "${{ needs.setup.outputs.preview_file_path }}"
      - name: Comment that the preview is gone
        run: |
          bash .github/scripts/pr-preview/generate-comment.sh remove > "$RUNNER_TEMP/comment.md"
          bash .github/scripts/pr-preview/comment.sh "$PR_NUMBER" "$RUNNER_TEMP/comment.md"
