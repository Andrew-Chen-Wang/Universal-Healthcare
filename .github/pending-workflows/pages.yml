# Publishes the site to the root of the gh-pages branch, which GitHub Pages serves
# (Settings > Pages > Source: Deploy from a branch, gh-pages, / (root)). PR previews
# live under pr-preview/ on the same branch and are left in place.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # The path review page writes to a local file, so it only exists in development.
      - run: rm -rf apps/website/src/app/paths/review
      - name: Build static site
        run: pnpm --filter website exec next build
        env:
          STATIC_EXPORT: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/website/out
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: pr-preview
          COMMIT_MESSAGE: "Deploy ${{ github.sha }}"
        run: bash .github/scripts/pr-preview/publish.sh deploy . "$RUNNER_TEMP/site"
