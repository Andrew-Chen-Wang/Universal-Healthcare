name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # The path review page writes to a local file, so it only exists in development.
      - run: rm -rf apps/website/src/app/paths/review
      - name: Build static site
        run: pnpm --filter website exec next build
        env:
          STATIC_EXPORT: "1"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
